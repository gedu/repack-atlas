name: PR checks

on:
  pull_request:
    # labeled/unlabeled: the size check reads labels from the event payload, so
    # adding `size:exception` must trigger a fresh run.
    types: [opened, edited, reopened, ready_for_review, synchronize, labeled, unlabeled]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit PR title
    runs-on: ubuntu-latest
    steps:
      # Checkout only for scripts/commit-check.mjs, so the title and the
      # commits share one list of types.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-check.mjs --message "$TITLE"

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Check every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-check.mjs --range "$BASE_SHA..$HEAD_SHA"

  size-budget:
    name: 400-line review budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check diff size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # pnpm-lock.yaml is generated; binary files report "-" and count 0.
          total=$(git diff --numstat "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)pnpm-lock.yaml' |
            awk '{ if ($1 != "-") a += $1; if ($2 != "-") d += $2 } END { print a + d + 0 }')
          echo "Changed lines: $total (excluding pnpm-lock.yaml)"
          if [ "$total" -le 400 ]; then
            echo "Within the 400-line review budget."
            exit 0
          fi
          if printf '%s' "$LABELS" | jq -e 'index("size:exception")' >/dev/null; then
            echo "Over budget but the PR carries the size:exception label."
            exit 0
          fi
          echo "::error::This PR changes $total lines (budget: 400)."
          echo "Split it into chained PRs, or ask a maintainer for the"
          echo "'size:exception' label. See CONTRIBUTING.md."
          exit 1

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check for a linked issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qE '(Closes|Fixes|Resolves|Refs) #[0-9]+'; then
            echo "PR references an issue."
          else
            echo "::error::The PR body must link an approved issue with"
            echo "  Closes #N | Fixes #N | Resolves #N | Refs #N"
            echo "Work is issue-first — see CONTRIBUTING.md."
            exit 1
          fi
