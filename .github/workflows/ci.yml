name: CI

# Light CI: one fast Linux job on every PR and every push to main. The heavy
# matrix (macOS + Linux, Node 22/24) and Studio e2e live in ci-full.yml and
# only run when a maintainer adds the `ready-to-merge` label.

on:
  push:
    branches: [main]
  pull_request:

# Newest run per ref wins; PRs and main pushes never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light:
    name: Lint, typecheck, build & test (Linux, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version comes from the packageManager field in package.json.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Agent files sync check
        run: pnpm agent:check
      - name: Vendored provenance check
        run: pnpm check:vendored
